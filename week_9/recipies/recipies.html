<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeBook</title>

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="RecipeBook">
    <meta property="og:description" content="Find delicious recipes like Apple Crisp.">
    <meta property="og:url" content="https://example.com">
    <meta property="og:image" content="images/apple-crisp.jpg">

    <!-- X Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="RecipeBook">
    <meta name="twitter:description" content="Find delicious recipes like Apple Crisp.">
    <meta name="twitter:image" content="images/apple-crisp.jpg">

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

    <!-- Google Fonts (Amatic SC matches the RecipeBook / Apple Crisp display font) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="recipies.css">
</head>
<body>
    <header>
        <div class="logo-title">
            <img src="images/recipe-book.png" alt="RecipeBook logo">
            <h1>RECIPEBOOK</h1>
        </div>
        <form class="search-form" action="#">
            <input type="text" placeholder="Find a recipe" aria-label="Find a recipe">
            <button type="submit" aria-label="Search">
                <img src="images/search.svg" alt="Search icon">
            </button>
        </form>
    </header>

    <main>
        <article class="recipe-card">
            <img class="recipe-image" src="images/apple-crisp.jpg" alt="Apple crisp topped with vanilla ice cream">
            <div class="recipe-content">
                <ul class="recipe-tags">
                    <li>dessert</li>
                </ul>
                <h2><a href="#">APPLE CRISP</a></h2>
                <span
                    class="rating"
                    role="img"
                    aria-label="Rating: 4 out of 5 stars"
                >
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star-empty">☆</span>
                </span>
                <p class="recipe-description">
                    This apple crisp recipe is a simple yet delicious fall dessert that's great served warm with vanilla ice cream.
                </p>
            </div>
        </article>
    </main>

    <footer>
        <div class="social">
            <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates -->
            <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
            <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
            <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>
        <a class="attribution" href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
    </footer>
</body>
</html>
