<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="card.css">
    <script src="card.js" defer></script>
</head>
<body>
    <main class="card">
        <img class="image" src="snortleblat.webp" alt="creature">
        <h1 class="name">Snortleblat</h1>
        <div class="stats">
            <p><strong>Class:</strong> Swamp Beast Diplomat</p>
            <p><strong>Level:</strong> <span id="level">5</span></p>
            <p><strong>Health:</strong> <span id="health">100</span></p>
        </div>
        <div class="button-container">
            <button id="attack-btn">Attacked</button>
            <button id="level-btn">Level Up</button>
        </div>
    </main>
</body>
</html>
